<rect x="85" y="566" width="150" height="56" rx="6" fill="#1c2128" stroke="#30363d"/><text x="160" y="588">HACC_IO</text><text x="160" y="606" fill="#8b949e" font-size="10">宇宙学模拟 IO</text>
<rect x="250" y="566" width="150" height="56" rx="6" fill="#1c2128" stroke="#30363d"/><text x="325" y="588">HACC_OPEN_CLOSE</text><text x="325" y="606" fill="#8b949e" font-size="10">元数据小 IO</text>
<rect x="415" y="566" width="120" height="56" rx="6" fill="#1c2128" stroke="#30363d"/><text x="475" y="588">BTIO</text><text x="475" y="606" fill="#8b949e" font-size="10">CFD 检查点</text>
<rect x="550" y="566" width="130" height="56" rx="6" fill="#1c2128" stroke="#30363d"/><text x="615" y="588">MADbench</text><text x="615" y="606" fill="#8b949e" font-size="10">CMB 分析</text>
<rect x="695" y="566" width="110" height="56" rx="6" fill="#1c2128" stroke="#30363d"/><text x="750" y="588">s3d_io</text><text x="750" y="606" fill="#8b949e" font-size="10">湍流燃烧</text>
<rect x="820" y="566" width="140" height="56" rx="6" fill="#23863622" stroke="#238636"/><text x="890" y="588" fill="#7ee787">MIXED 混合应用</text><text x="890" y="606" fill="#8b949e" font-size="10">六阶段 ~30min</text>
<rect x="975" y="566" width="130" height="56" rx="6" fill="#23863622" stroke="#238636"/><text x="1040" y="588" fill="#7ee787">STRESS 压力测试</text><text x="1040" y="606" fill="#8b949e" font-size="10">3批次 48槽</text>
</g>
<text x="590" y="656" fill="#8b949e" text-anchor="middle" font-size="11">bsub -n 8 -R "span[ptile=2]" → $LSB_MCPU_HOSTS 动态 hostfile → mpirun --prefix $MPI_HOME · OpenMPI</text>
<text x="590" y="678" fill="#8b949e" text-anchor="middle" font-size="11">结果 → /data/hpc/lsf_logs/*.out → 门户解析带宽/GiB/exit code 汇总 → Grafana 指标可视化</text>
</g>
